services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # asyncpg 드라이버 — app/db.py의 create_async_engine이 요구한다(plain
      # "postgresql://"는 async 드라이버가 아니라서 즉시 에러가 난다).
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:password@postgres:5432/sub_translation_qc}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_media:/app/media

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sub_translation_qc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    # 호스트에 5432를 노출하지 않는다 — backend는 Docker 내부 네트워크로
    # postgres:5432에 그대로 접근 가능하고, 포트 매핑이 없으면 EC2
    # 보안그룹 설정 실수로도 DB가 인터넷에 열릴 수 없다.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  backend_media:
  caddy_data:
  caddy_config:
