server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 끝에 슬래시가 붙은 location(/api/)과 proxy_pass 대상(.../)이 짝을
        # 이루면 nginx가 자동으로 /api/ 접두어를 떼고 나머지만 넘긴다 —
        # 별도 rewrite 지시어 없이 표준 nginx만으로 되는 방식이다
        # (proxy_rewrite는 OpenResty 전용이라 표준 nginx:alpine엔 없음).
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
