language: en
variant: US
display_name: 영어 (미국)
# 영어는 tú/usted 같은 문법적 존댓말/반말 구분이 없다 — 격식 확인 단계
# 자체를 건너뛴다(check_grammar_necessity 참고).
formality_applicable: false
# 줄바꿈 위치 비용 계산용 단어(소문자) — conjunctions/prepositions 앞은 싸게, no_break_after 뒤는 금지(rewrap_line).
line_break:
  conjunctions: [and, but, or, because, although, while, when, if, that, so, as, nor]
  prepositions: [of, in, "on", at, for, with, from, by, about, into, over, under, between, through, during, after, before, without]
  no_break_after: [the, a, an, my, your, his, her, our, their, this, that, these, those, is, are, was, were, am, be, been, have, has, had, will, would, can, could, should, do, does, did, not, to]
  no_break_phrases: ["so that", "as soon as", "as well as", "in order to", "such as"]
