language: es
variant: LATAM
display_name: 스페인어 (중남미)
formality_instruction: >
  informal이면 tú 활용형(2인칭 단수 반말)으로, formal이면 usted 활용형(3인칭 단수 활용
  기반 존댓말)으로.
# 번역문의 인칭 표지 — 카드 설명이 "화자 자신"인데 2인칭 표지만 있으면 청자로 바로잡는 데 쓴다.
second_person_markers: [tú, usted, ustedes, vos]
first_person_markers: [yo, soy, estoy]
# 제안문(corrected_text) 작성 시 스페인어 표기 규칙 — 프롬프트의 "자연스러움 지침"으로 들어간다.
naturalness_check:
  llm_instruction: >
    제안문은 스페인어 표기 규칙을 지켜라. 의문문·감탄문은 ¿…?, ¡…!를 반드시 짝으로
    쓴다(끝에 ?나 !만 있고 앞의 ¿·¡가 빠지면 안 된다). 독립된 문장은 대문자로
    시작하고, 앞 줄에서 이어지는 문장일 때만 소문자로 시작해도 된다. 강세 부호(á, é,
    í, ó, ú, ñ)를 빠뜨리지 마라.
# 줄바꿈 위치 비용 계산용 단어(소문자) — conjunctions/prepositions 앞은 싸게, no_break_after 뒤는 금지(rewrap_line).
line_break:
  conjunctions: [y, e, o, u, pero, porque, aunque, mientras, cuando, si, que, como, sino, ni, pues]
  prepositions: [a, de, en, con, para, por, sin, sobre, contra, entre, desde, hasta, hacia, bajo, durante, tras, según, ante]
  no_break_after: [el, la, los, las, un, una, unos, unas, del, al, mi, tu, su, mis, tus, sus, nuestro, nuestra, este, esta, ese, esa, estos, estas, esos, esas, me, te, se, lo, le, nos, les, "no", es, está, soy, eres, son, está, están, era, fue, estoy, estás, ha, he, has, han, hay, voy, vas, va, vamos, puedo, puedes, puede, podemos, pueden, debo, debes, debe, tengo, tienes, tiene, estaba, había]
  no_break_phrases: ["para que", "hasta que", "por qué", "por que", "así que", "desde que", "a pesar de"]
