language: it
variant: IT
display_name: 이탈리아어 (이탈리아)
formality_instruction: >
  informal이면 tu 활용형(2인칭 단수 반말)으로, formal이면 Lei 활용형(3인칭 단수 활용
  기반 존댓말)으로.
# 번역문의 인칭 표지 — 카드 설명이 "화자 자신"인데 2인칭 표지만 있으면 청자로 바로잡는 데 쓴다.
second_person_markers: [tu, Lei, voi, Loro]
first_person_markers: [io, sono, sto]
# 성별 어긋남 검사는 be 동사(cop/aux)에 매달린 형용사·분사·술어 명사만 비교한다 — have류·호격·계사류 동사 구조는 일치 대상이 불확실해 건너뜀. 목록이 없으면 전부 비교.
# sei/stato는 spaCy(it_core_news_md)가 "Tu sei", "sei stato"의 essere를 lemma로 못 읽어서 따로 넣었다 — 모델을 바꾸면 다시 확인할 것.
be_verb_lemmas: [essere, sei, stato]
# 제안문(corrected_text) 작성 시 이탈리아어 표기 규칙 — 프롬프트의 "자연스러움 지침"으로 들어간다.
naturalness_check:
  llm_instruction: >
    제안문은 이탈리아어 표기 규칙을 지켜라. 대사·인용은 직선 큰따옴표 "…"로 쓰고,
    꺾쇠 따옴표 « »는 쓰지 마라. 강세 부호(à, è, é, ì, ò, ù)를 빠뜨리지 마라.
    모음 앞 축약은 아포스트로피로 쓴다(l'amico, un'amica, c'è, dov'è). 독립된
    문장은 대문자로 시작한다.
# 줄바꿈 위치 비용 계산용 단어(소문자) — conjunctions/prepositions 앞은 싸게, no_break_after 뒤는 금지(rewrap_line).
line_break:
  conjunctions: [e, ed, o, od, ma, però, perché, anche, quando, se, che, come, mentre, né, quindi, poiché, sebbene, finché]
  prepositions: [di, a, da, in, con, su, per, tra, fra, senza, sopra, sotto, contro, verso, dopo, prima, durante, presso]
  no_break_after: [il, lo, la, i, gli, le, l', un, uno, una, un', del, dello, della, dei, degli, delle, al, allo, alla, ai, agli, alle, nel, nella, nei, nelle, sul, sulla, mio, mia, miei, mie, tuo, tua, tuoi, tue, suo, sua, suoi, sue, nostro, nostra, vostro, vostra, questo, questa, quel, quella, mi, ti, si, ci, vi, lo, non, è, sono, sei, siamo, siete, era, ero, ho, hai, ha, abbiamo, hanno, sta, sto, stai, sta, va, vado, vai, può, posso, puoi, devo, devi, deve]
  no_break_phrases: ["per cui", "così che", "anche se", "dato che", "fin da", "a meno che", "per quanto", "di modo che", "non appena"]
