language: fr
variant: FR
display_name: 프랑스어 (프랑스)
formality_instruction: >
  informal이면 tu 활용형(2인칭 단수 반말)으로, formal이면 vous 활용형(2인칭 복수 활용
  기반 존댓말)으로.
# 번역문의 인칭 표지 — 카드 설명이 "화자 자신"인데 2인칭 표지만 있으면 청자로 바로잡는 데 쓴다.
second_person_markers: [tu, vous, "t'"]
first_person_markers: [je, "j'", "m'"]
# 성별 어긋남 검사는 be 동사(cop/aux)에 매달린 형용사·분사·술어 명사만 비교한다 — have류·호격·계사류 동사 구조는 일치 대상이 불확실해 건너뜀. 목록이 없으면 전부 비교.
be_verb_lemmas: [être]
# 이 부호들 앞에는 공백을 둔다 — 내보낼 때 빠진 곳에 자동으로 넣는다(assemble_final_srt).
space_before_punct: "?!:;"
# 제안문(corrected_text) 작성 시 프랑스어 표기 규칙 — 프롬프트의 "자연스러움 지침"으로 들어간다.
naturalness_check:
  llm_instruction: >
    제안문은 프랑스어 표기 규칙을 지켜라. 대사·인용은 직선 큰따옴표 "…"로 쓰고, 그
    안의 인용은 작은따옴표 '…'로 쓴다. 꺾쇠 따옴표 « »는 절대 쓰지 마라. ? ! : ; 앞에는
    공백을 한 칸 둔다(예: Quoi ?). 대문자에도 악센트를 붙인다(À, É).
# 합자 œ로 써야 하는 단어(프랑스어 맞춤법 사전에서 추려 변화형까지 펼침) — 내보낼 때 "oe"로 쓴 같은 단어를
