language: fr
variant: FR
display_name: 프랑스어 (프랑스)
formality_instruction: >
  informal이면 tu 활용형(2인칭 단수 반말)으로, formal이면 vous 활용형(2인칭 복수 활용
  기반 존댓말)으로.
# 번역문의 인칭 표지 — 카드 설명이 "화자 자신"인데 2인칭 표지만 있으면 청자로 바로잡는 데 쓴다.
second_person_markers: [tu, vous, "t'"]
first_person_markers: [je, "j'", "m'"]
# 줄바꿈 위치 비용 계산용 단어(소문자) — conjunctions/prepositions 앞은 싸게, no_break_after 뒤는 금지(rewrap_line).
line_break:
  conjunctions: [et, ou, mais, car, donc, que, si, quand, parce, comme, lorsque, puisque, alors, ni]
  prepositions: [de, à, en, dans, pour, par, sur, sous, avec, sans, chez, vers, entre, depuis, pendant, contre, après, avant]
  no_break_after: [le, la, les, un, une, des, du, au, aux, mon, ma, mes, ton, ta, tes, son, sa, ses, notre, votre, leur, ce, cet, cette, ces, je, tu, il, elle, "on", nous, vous, ils, elles, ne, me, te, se, est, suis, es, sont, a, ai, as, avons, avez, ont, était, sera]
  no_break_phrases: ["parce que", "est-ce que", "qu'est-ce que", "qu'est-ce qui", "bien que", "pour que", "afin que", "plus tard", "par la suite", "dès que", "alors que", "ainsi que"]
